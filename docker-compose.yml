services:
  api:
    container_name: api
    build:
      context: ./api
      target: dev
    ports:
      - '5050:5050'
    env_file:
      - .env
    volumes:
      - ./api:/app
      - ./.data/api:/.data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - process_api_net
    depends_on:
      minio:
        condition: service_started
      postgres:
        condition: service_healthy

  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./.data/minio:/data
    networks:
      - process_api_net

  postgres:
    container_name: postgres
    image: postgres:17.2-alpine3.20
    env_file:
      - .env
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    networks:
      - process_api_net

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev
    env_file:
      - .env
    ports:
      - '8080:8080'
    networks:
      - process_api_net

networks:
  process_api_net:
    external: true
