services:
  api:
    container_name: api
    build:
      context: ./api
    ports:
      - '80:5050'
    env_file:
      - .env
    volumes:
      - ./api/plugins:/app/plugins
      - ./.data/api:/.data
      - /var/run/docker.sock:/var/run/docker.sock
    # GPU scheduling: the API launches job containers as siblings on the host
    # daemon, so those can be given GPUs while this container cannot see any.
    # Uncomment to let the API enumerate host GPUs at startup. Visibility is not
    # allocation, the API runs no GPU work itself. Without this, set
    # SKIP_GPU_VERIFICATION=true and MAX_LOCAL_GPUS explicitly. See GPU_GUIDE.md.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - sepex_net
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  minio:
    container_name: minio
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z.fips
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./.data/minio:/data
    networks:
      - sepex_net
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live || exit 1' ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    container_name: minio-init
    image: minio/mc:RELEASE.2023-08-18T21-57-55Z
    env_file:
      - .env
    networks:
      - sepex_net
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$STORAGE_BUCKET && echo 'Bucket ready.' "

  postgres:
    container_name: postgres
    image: postgres:17.2-alpine3.20
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB' ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    networks:
      - sepex_net

networks:
  sepex_net:
    external: true
